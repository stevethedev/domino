name: Tauri Linux system dependencies
description: Installs the Ubuntu packages Tauri builds against, cached between runs.

runs:
  using: composite
  steps:
    # The cache action only refreshes the index under nektos/act, so a stale runner-image index
    # could 404 on a cache miss. Any fetch error fails the job here: the cache action ignores a
    # failed install and saves an empty cache, which every later run restores instead of installing.
    - name: Refresh APT package index
      id: apt
      shell: bash
      run: |
        sudo apt-get update --error-on=any
        . /etc/os-release && echo "ubuntu=$VERSION_ID" >> "$GITHUB_OUTPUT"

    - name: Install packages (cached)
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
        # The cache key doesn't include the OS release, so it's added here: packages built for one
        # Ubuntu release can't be restored on another. Bump the number to drop the cached packages.
        version: 1-ubuntu${{ steps.apt.outputs.ubuntu }}

    # A cache saved by a failed install restores "successfully" with nothing in it. The cache holds
    # files, not dpkg's records, so this asks pkg-config rather than dpkg.
    - name: Check the packages are there
      shell: bash
      run: |
        if pkg-config --exists webkit2gtk-4.1 gtk+-3.0 librsvg-2.0 && command -v patchelf > /dev/null; then
          exit 0
        fi
        echo "::warning title=Incomplete apt cache::The cached Tauri packages were missing, so they were installed directly. Delete the cache (gh cache list --key cache-apt-pkgs_) so the next run refills it."
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
