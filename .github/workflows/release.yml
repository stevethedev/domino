name: Release

on:
  push:
    tags:
      - "v*"
  # tag-release.mjs pushes the release tag using the job's GITHUB_TOKEN, and
  # GitHub Actions doesn't let GITHUB_TOKEN-authored pushes trigger other
  # workflows (loop prevention) — so the `push: tags:` trigger above never
  # fires for it. It instead dispatches this workflow_dispatch event
  # directly via the Actions API, passing the tag it just pushed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # rust.yml/typescript.yml only trigger on pushes to main/PRs, not tag
  # pushes, so a release build would otherwise skip verification entirely
  # for the exact commit being tagged. Re-run both here as a gate.
  verify-rust:
    uses: ./.github/workflows/rust.yml

  verify-typescript:
    uses: ./.github/workflows/typescript.yml

  # One draft for the tag, made before the builds and handed to them by id. Left to find it by tag,
  # each build makes its own draft when it can't see one (say, if it's been published), and the
  # release splits across two. On a re-run this reuses the draft from the first attempt.
  create-release:
    needs: [verify-rust, verify-typescript]
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The release body is this version's CHANGELOG.md section (changesets/action never creates the
      # release: tag-release.mjs tags and dispatches this build itself). Fails if the section is missing.
      - name: Find or make the draft release
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          id="$(node scripts/release-draft.mjs "$TAG")" # an assignment, so the step fails with the script
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_dispatch runs against whatever ref the dispatch call
          # targets (used so the workflow_dispatch trigger itself can be
          # found), which isn't necessarily the tag being released —
          # check out the tag explicitly instead.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Tauri Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/tauri-linux-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.93.1 # keep in step with src-tauri/rust-toolchain.toml
          targets: ${{ matrix.rust-targets }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Signed updater artifacts and latest.json are built here only (tauri.release.conf.json), so
      # local `tauri build` works without the signing key, and only once the signing secret exists
      # (until then releases build without in-app update files). The app checks the latest
      # *published* release, so an update reaches users when this draft is published: once
      # check-release passes.
      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # With releaseId these don't find the release; they set latest.json's download links.
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          args: ${{ matrix.args }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.release.conf.json' || '' }}

  # Each build merges its platforms into latest.json by downloading and re-uploading it, so two
  # finishing together can drop one's entries. This fails, naming what's wrong, unless the draft is
  # still unpublished and latest.json offers the update on every platform with this release's files.
  check-release:
    needs: [create-release, build-and-release]
    runs-on: ubuntu-latest
    env:
      # Unsigned builds upload no latest.json, so there's nothing to check.
      SIGNED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.SIGNED == 'true'
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Node
        if: env.SIGNED == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the draft is ready to publish
        if: env.SIGNED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        run: node scripts/release-check.mjs "$RELEASE_ID"
