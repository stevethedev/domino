name: TypeScript

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Types, lint (type-aware), formatting and unused code/deps (see package.json "check:*").
      - name: Check
        run: npm run check

      - name: Test
        run: npm test
