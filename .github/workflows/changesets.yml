name: Changesets

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Lets tag-release.mjs dispatch release.yml directly via the Actions API
  # (see release.yml's workflow_dispatch trigger for why that's needed).
  actions: write

jobs:
  version-or-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The cache action only refreshes the index under nektos/act, so a stale runner-image index
      # could 404 on a cache miss.
      - name: Refresh APT package index
        run: sudo apt-get update

      # sync-version.mjs runs `cargo check` to refresh Cargo.lock, which needs these.
      - name: Install Tauri Linux system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
          version: 1 # bump to drop the cached packages

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.93.1 # keep in step with src-tauri/rust-toolchain.toml

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # With pending changesets: opens/updates a "Version Packages" PR that
      # runs `npm run release:version` (bumps package.json + package-lock.json + Cargo.toml +
      # tauri.conf.json together, writes CHANGELOG.md).
      #
      # With no pending changesets (i.e. that PR was just merged): runs
      # `publish`, which tags the release commit instead of publishing to
      # npm — tag-release.mjs then dispatches release.yml's cross-platform build.
      - name: Version or release
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run release:version
          publish-script: node scripts/tag-release.mjs
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
