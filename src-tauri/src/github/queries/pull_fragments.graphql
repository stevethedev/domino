# Pull request fields (state is aliased to pullState: GraphQL rejects one response name with two
# enum types, IssueState and PullRequestState); uses the LinkedIssue and LinkedPull fragments from issue_fragments.graphql.
fragment PullReferences on PullRequestTimelineItemsConnection {
  nodes {
    __typename
    ... on CrossReferencedEvent {
      willCloseTarget
      source {
        ...LinkedIssue
        ...LinkedPull
      }
    }
    ... on ConnectedEvent {
      subject {
        ...LinkedIssue
        ...LinkedPull
      }
    }
    ... on DisconnectedEvent {
      subject {
        ...LinkedIssue
        ...LinkedPull
      }
    }
  }
  pageInfo {
    hasNextPage
  }
}

fragment PullTicket on PullRequest {
  __typename
  id
  number
  title
  url
  pullState: state
  isDraft
  merged
  # The verdict under the base branch's review rules (null when none require reviews), and each
  # reviewer with write access's latest approval or change request, for when it's null (a cut-off
  # list can't show approval: toRaw.ts reads it as in review).
  reviewDecision
  latestOpinionatedReviews(first: 50, writersOnly: true) {
    nodes {
      state
    }
    pageInfo {
      hasNextPage
    }
  }
  createdAt
  closedAt
  body
  bodyText
  repository {
    nameWithOwner
    defaultBranchRef {
      name
    }
  }
  # Stacked pull requests: the open ones whose head is this one's base branch. Null when the branch is gone.
  baseRefName
  baseRef {
    associatedPullRequests(first: 10, states: [OPEN]) {
      nodes {
        ...LinkedPull
      }
      pageInfo {
        hasNextPage
      }
    }
  }
  author {
    login
    avatarUrl
    ... on User {
      name
    }
  }
  assignees(first: 10) {
    nodes {
      login
      name
      avatarUrl
    }
  }
  milestone {
    id
    title
    dueOn
    state
  }
  # Closed issues are included: there's no includeClosed here (includeClosedPrs is on Issue.closedByPullRequestsReferences).
  closingIssuesReferences(first: 50) {
    nodes {
      ...LinkedIssue
    }
    pageInfo {
      hasNextPage
    }
  }
  timelineItems(first: 100, itemTypes: [CROSS_REFERENCED_EVENT, CONNECTED_EVENT, DISCONNECTED_EVENT]) {
    ...PullReferences
  }
}
